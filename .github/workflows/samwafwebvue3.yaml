# 提交 master 或推送 v* tag 时构建前端；前端构建成功后通知 SamWaf 后端仓库构建。

name: SamWafWebVue3 CI
run-name: SamWafWebVue3 CI · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: samwafwebvue3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create .zip package
        run: |
          zip -r dist.zip dist

      - name: Create .tar.gz package
        run: |
          tar -czvf dist.tar.gz dist

      - name: Upload artifacts dist.zip
        uses: actions/upload-artifact@v4
        with:
          name: dist.zip
          path: dist.zip

      - name: Upload artifacts dist.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: dist.tar.gz
          path: dist.tar.gz

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: |
            dist.zip
            dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch_config:
    name: Check backend dispatch configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          BACKEND_DISPATCH_TOKEN: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
        run: |
          if [ -n "$BACKEND_DISPATCH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BACKEND_DISPATCH_TOKEN is not configured; using the temporary reusable-workflow fallback."
          fi

  build-samwaf-with-frontend:
    name: Build SamWaf with this frontend (fallback)
    needs: [build, dispatch_config]
    if: needs.dispatch_config.outputs.configured != 'true'
    uses: caspar94/SamWaf/.github/workflows/full-platform-test.yml@main
    with:
      frontend_ref: ${{ github.sha }}
      run_macos: true
      run_win7: true

  trigger-samwaf-build:
    name: Trigger SamWaf backend build
    needs: [build, dispatch_config]
    if: needs.dispatch_config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch backend build
        uses: actions/github-script@v7
        env:
          FRONTEND_REF: ${{ github.sha }}
          FRONTEND_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'caspar94',
              repo: 'SamWaf',
              event_type: 'frontend-updated',
              client_payload: {
                frontend_ref: process.env.FRONTEND_REF,
                frontend_run_id: process.env.FRONTEND_RUN_ID,
                frontend_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            });
            core.notice(`SamWaf backend build dispatched for frontend ${process.env.FRONTEND_REF}`);
